<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>iito 演者ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  演者ページ（2026-11-23）
  ・演者（モデル本人）が、専用リンク（talent.html?k=鍵）から、自分の順位・全体のランキング・投票者一覧を見るページ。
  ・投票者の画面（index.html）とも、管理画面とも別のページ。読むだけで、票の記録には書き込まない。
  ・専用リンクの発行・停止は talent.html?admin=1 から（管理者のパスワードが必要）。
  ・talent.html?demo=1 で、架空のデータで見た目を確認できる。
-->
<style>
:root{
  --ac:#9C1A4F;--ac-l:#FCE8F0;--ac-m:#F2B6CB;--tx:#1F1A1C;--sub:#8A7F84;--bd:#ECE7EA;--card:#F8F7F8;--bg:#FFFFFF;
  --gold-bg:#FFFBEA;--gold-bd:#F2C94C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ev-pill{display:inline-block;border:1.5px solid var(--ac);color:var(--ac);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;line-height:1.5;max-width:100%}
.ev-sel{margin-top:8px;font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);max-width:100%}
.name{font-size:34px;font-weight:900;color:var(--ac);margin:12px 0 0;line-height:1.25;word-break:break-all}
.sum{text-align:right;margin-left:auto}
.sum .lbl{font-size:12px;color:var(--sub);font-weight:700}
.sum .big{display:inline-flex;align-items:baseline;gap:4px;background:var(--ac);color:#fff;border-radius:14px;padding:8px 22px;margin:6px 0 8px;box-shadow:0 4px 12px rgba(156,26,79,.25)}
.sum .big b{font-size:34px;font-weight:900;letter-spacing:.01em}
.sum .big span{font-size:13px;font-weight:700}
.chips{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.chip{border:1.5px solid var(--ac-m);color:var(--ac);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;background:#fff;white-space:nowrap}
.myrank{margin-top:6px;font-size:13px;color:var(--sub);font-weight:700}
.myrank b{color:var(--ac);font-size:18px}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;max-width:220px;font-family:inherit;font-size:14px;font-weight:700;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer}
.tabs button.on{background:var(--ac-l);border-color:var(--ac-m);color:var(--ac)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.legend .note{font-size:11.5px;color:var(--sub);margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid;white-space:nowrap;line-height:1.5}
.t-supporter{background:#E6F4FF;border-color:#7CC4F5;color:#1673B5}
.t-partner{background:#E6F9EF;border-color:#6FD3A0;color:#13824F}
.t-producer{background:#F1EAFF;border-color:#B9A2F5;color:#6A3FD0}
.t-free{background:#E8F6FF;border-color:#8ACFF2;color:#0E6E9E}
.t-paid{background:#FFF2E5;border-color:#F5B985;color:#C25A00}
.t-guest{background:#F2F2F2;border-color:#CFCFCF;color:#777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}.top{flex-direction:column;gap:8px}.top>div{width:100%}.ev-pill{border-radius:14px;font-size:12px}.name{font-size:28px}.sum{text-align:left;margin-left:0}.chips{justify-content:flex-start}}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:52px}
.row.top1{background:var(--gold-bg);border-color:var(--gold-bd)}
.row.me{background:var(--ac-l);border-color:var(--ac-m)}
.rk{flex:0 0 30px;text-align:center;font-style:italic;font-weight:900;color:var(--ac);font-size:16px}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who .nm{font-weight:700;font-size:15px;word-break:break-all}
.who .nm.guest{color:var(--sub);font-style:italic;font-weight:500}
.ct{flex:0 0 auto;background:var(--ac);color:#fff;border-radius:999px;padding:5px 14px;font-weight:900;font-size:14px;white-space:nowrap}
.ct small{font-size:11px;font-weight:700;margin-left:1px}
.br{font-size:11px;color:var(--sub);width:100%;margin-top:1px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.foot{text-align:center;color:#D9A7BC;letter-spacing:.2em;font-weight:700;font-size:13px;margin-top:28px}
.upd{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);margin-top:6px}
.upd button{font-family:inherit;font-size:11.5px;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--tx)}
.err{max-width:460px;margin:80px auto;text-align:center;line-height:1.8;font-size:14px}
.err h2{color:var(--ac);font-size:18px}
.demo{background:#FFF4E5;border-bottom:1px solid #F0A020;color:#7A4A00;font-size:12px;text-align:center;padding:8px 14px}
/* ════ 演者の画面：黒地＋ゴールド。見やすさ・わかりやすさを最優先にした、シンプルな形（2026-11-24） ════ */
html:has(body.tv){background:#0E0E11}
body.tv{min-height:100vh;--gd:#E8C766;--sv:#D6DCE4;--bz:#E0A97E;--bk:#0E0E11;--bk2:#18181D;--ln:#2A2A31;--tx2:#FFFFFF;--sub2:#A6A6B0;background:var(--bk);color:var(--tx2)}
body.tv .wrap{max-width:720px;padding-top:16px}
.tv-ev{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub2)}
.tv-ev .evn{font-weight:700;color:var(--sub2)}
.tv-ev .cd{font-variant-numeric:tabular-nums;white-space:nowrap}
.tv-ev .cd b{color:var(--tx2);font-size:14px}
body.tv .ev-sel{background:var(--bk2);color:var(--tx2);border-color:var(--ln);margin-top:6px}
.hero{text-align:center;padding:22px 0 18px;border-bottom:1px solid var(--ln)}
.hero .nm{font-size:20px;font-weight:700;color:var(--tx2);word-break:break-all}
.hero .rk-lbl{font-size:13px;color:var(--sub2);margin-top:14px}
.hero .rk-big{font-size:84px;font-weight:900;line-height:1.05;color:var(--gd);font-variant-numeric:tabular-nums}
.hero .rk-big small{font-size:32px;margin-left:2px}
.hero .rk-of{font-size:13px;color:var(--sub2)}
.hero .gap{font-size:17px;font-weight:700;margin-top:12px;color:var(--tx2)}
.hero .gap b{color:var(--gd);font-size:22px;margin:0 2px}
.hero .tot{font-size:16px;margin-top:14px;color:var(--tx2)}
.hero .tot b{font-size:22px;font-variant-numeric:tabular-nums}
.hero .tot .sep{color:var(--ln);margin:0 10px}
.hero .sub{font-size:13px;color:var(--sub2);margin-top:4px}
body.tv .tabs{margin:16px 0 10px;background:var(--bk2);border-radius:12px;padding:4px;gap:4px}
body.tv .tabs button{max-width:none;border:none;background:transparent;color:var(--sub2);font-size:15px;padding:10px}
body.tv .tabs button.on{background:#2C2C34;color:var(--tx2)}
.note2{font-size:12px;color:var(--sub2);margin:0 2px 8px}
.list{display:flex;flex-direction:column;gap:6px}
.r{display:flex;align-items:center;gap:12px;background:var(--bk2);border:1px solid transparent;border-radius:12px;padding:12px 14px}
.r .n{flex:0 0 34px;text-align:center;font-size:18px;font-weight:900;color:var(--sub2);font-variant-numeric:tabular-nums}
.r .b{flex:1;min-width:0}
.r .t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.r .nm{font-size:16px;font-weight:700;color:var(--tx2);word-break:break-all}
.r .nm.guest{color:var(--sub2);font-weight:500}
.r .s{font-size:12px;color:var(--sub2);margin-top:2px}
.r .v{flex:0 0 auto;font-size:20px;font-weight:900;color:var(--tx2);font-variant-numeric:tabular-nums}
.r .v small{font-size:12px;font-weight:700;color:var(--sub2);margin-left:1px}
.r.k1 .n{color:var(--gd);font-size:24px}.r.k2 .n{color:var(--sv);font-size:22px}.r.k3 .n{color:var(--bz);font-size:22px}
.r.k1,.r.k2,.r.k3{padding:15px 14px}
.r.k1 .nm,.r.k2 .nm,.r.k3 .nm{font-size:17px}
.r.me{border-color:var(--gd)}
.hd{padding:6px 0 4px}
.hd .evn{font-size:13px;color:var(--sub2)}
.hd .nm{font-size:26px;font-weight:900;color:var(--tx2);margin-top:4px;word-break:break-all}
.r .b{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 10px}
.r .b>.nm{display:flex;align-items:center;gap:6px}
.cs{display:flex;gap:6px;flex-wrap:wrap}
.c{display:inline-flex;align-items:baseline;gap:4px;font-size:14px;font-weight:700;border-radius:8px;padding:2px 9px;font-variant-numeric:tabular-nums}
.c i{font-style:normal;font-size:11px;font-weight:700;opacity:.85}
.c.p{background:#2E2548;color:#D5C8FF}.c.y{background:#3B2A15;color:#FFCD94}.c.f{background:#17323F;color:#A8E0F7}
.c.z{opacity:.35}
.vt{display:flex;flex-direction:column;gap:4px}
.vh,.vr{display:grid;grid-template-columns:30px minmax(0,1fr) 46px 40px 40px 58px;align-items:center;gap:6px;padding:0 12px}
.vh{font-size:11px;color:var(--sub2);padding-bottom:2px}
.vh .qh{text-align:right}
.vh .qh.p{color:#C9B8FB}.vh .qh.y{color:#FFCD94}.vh .qh.f{color:#A8E0F7}
.vr{background:var(--bk2);border-radius:10px;min-height:48px}
.vr .n{font-size:16px;font-weight:900;color:var(--sub2);text-align:center;font-variant-numeric:tabular-nums}
.vr .nm{font-size:15px;font-weight:700;color:var(--tx2);word-break:break-all;line-height:1.35;padding:8px 0}
.vr .q{text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx2)}
.vr .q.p{color:#C9B8FB}.vr .q.y{color:#FFCD94}.vr .q.f{color:#A8E0F7}
.vr .q.z{color:#4A4A52}
.vr .tv2{text-align:right;font-size:17px;font-weight:900;color:var(--tx2);font-variant-numeric:tabular-nums}
.vr.k1 .n{color:var(--gd);font-size:20px}.vr.k2 .n{color:var(--sv);font-size:19px}.vr.k3 .n{color:var(--bz);font-size:19px}
@media (max-width:400px){.vh,.vr{grid-template-columns:24px minmax(0,1fr) 40px 34px 34px 50px;gap:4px;padding:0 8px}.vr .nm{font-size:14px}.vr .q{font-size:13px}.vr .tv2{font-size:15px}}
/* 上部をコンパクトに：投票者一覧の一覧が、開いてすぐ目に入るように（2026-11-24） */
.hero2{display:flex;align-items:center;gap:16px;padding:12px 4px 14px;border-bottom:1px solid var(--ln)}
.h2r{flex:0 0 auto;text-align:center;min-width:92px}
.h2l{font-size:11px;color:var(--sub2);white-space:nowrap}
.h2l span{font-size:10px}
.h2v{font-size:54px;font-weight:900;line-height:1;color:var(--gd);font-variant-numeric:tabular-nums}
.h2v small{font-size:20px;margin-left:1px}
.h2m{flex:1;min-width:0}
.h2nm{font-size:20px;font-weight:900;color:var(--tx2);word-break:break-all;line-height:1.3}
.h2gap{font-size:14px;font-weight:700;color:var(--tx2);margin-top:4px}
.h2gap b{color:var(--gd);font-size:18px;margin:0 2px}
.h2tot{font-size:13px;color:var(--sub2);margin-top:2px}
.h2tot b{font-size:17px;color:var(--tx2);font-variant-numeric:tabular-nums}
.hd .evn{font-size:12px}
body.tv .tabs{margin:10px 0 8px}
body.tv .tabs button{padding:8px;font-size:14px}
.vt{gap:3px!important}
.vr{min-height:36px!important;border-radius:8px!important}
.vr .nm{font-size:14px!important;padding:5px 0!important}
.vr .n{font-size:14px!important}.vr.k1 .n{font-size:17px!important}.vr.k2 .n,.vr.k3 .n{font-size:16px!important}
.vr .q{font-size:13px!important}.vr .tv2{font-size:15px!important}
.r{padding:8px 12px!important;border-radius:8px!important}
.list{gap:3px!important}
.r .v{font-size:16px!important}.r .nm{font-size:14px!important}
.r.k1,.r.k2,.r.k3{padding:10px 12px!important}
.pt{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;line-height:1.6}
.pt.supporter{background:#1E3446;color:#9FD2F7}.pt.partner{background:#1B3A2C;color:#8FE0B8}.pt.producer{background:#2E2548;color:#C9B8FB}
.pt.guest{background:#2A2A31;color:#B5B5BE}.pt.you{background:var(--gd);color:#1A1500}
body.tv .empty{color:var(--sub2)}
body.tv .upd{color:var(--sub2);justify-content:center}
body.tv .upd button{background:var(--bk2);border-color:var(--ln);color:var(--tx2)}
body.tv .foot{color:#5C5C66}
body.tv .err h2{color:var(--gd)}
body.tv .demo{background:#2A2210;border-color:#6B5520;color:#F1D58A}
.secret{margin:16px 0 6px;padding:10px 14px;border:1px solid rgba(232,199,102,.45);border-radius:10px;background:rgba(232,199,102,.08);color:#E9E2CF;font-size:12.5px;line-height:1.7}
.secret b{color:#F3D98A}
.secret .ban{display:block;margin-top:6px;color:#FF8A80;font-weight:700}
.ban-top{margin:0 0 8px;padding:7px 12px;border-radius:8px;background:rgba(255,82,82,.12);border:1px solid rgba(255,82,82,.45);color:#FF8A80;font-size:12px;font-weight:700;line-height:1.5}
@media (prefers-color-scheme: light){.secret .ban,.ban-top{color:#C62828}.ban-top{background:#FFECEC;border-color:#F5A3A3}}
/* 下に浮かぶメニュー（投票ページと同じ形）。スクロールしても常に表示（2026-11-24） */
body.tv .wrap{padding-bottom:84px}
.ttb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:420px;display:flex;justify-content:space-around;align-items:center;gap:4px;padding:4px;background:rgba(32,32,38,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #33333C;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:40}
.ttb-btn{flex:1 1 0;height:38px;border:none;background:transparent;border-radius:999px;cursor:pointer;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;color:#A6A6B0;font-family:inherit;-webkit-tap-highlight-color:transparent}
.ttb-ic{font-size:17px;line-height:1}
.ttb-lb{font-size:13px;font-weight:700}
.ttb-btn.on{background:rgba(232,199,102,.16);color:#F3D98A}
@media (prefers-color-scheme: light){
  .ttb{background:rgba(255,255,255,.94);border-color:#E4E2DC;box-shadow:0 6px 24px rgba(0,0,0,.12)}
  .ttb-btn{color:#6E6E78}
  .ttb-btn.on{background:#FFF3D6;color:#8A5D00}
}
/* 下にスクロールするとメニューを隠し、上にスクロールすると出す（投票ページと同じ動き。2026-11-24）
   出てくるときはゆっくり（0.7秒）、隠れるときは速め（0.25秒） */
.ttb{transition:transform .7s ease-in-out,opacity .7s ease-in-out}
body.tb-hide .ttb{transform:translate(-50%,calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .25s ease,opacity .25s ease}
/* 初めて開いたときの注意事項 */
.agree-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.agree-box{max-width:460px;width:100%}
.agree-ttl{font-size:20px;font-weight:900;text-align:center;color:var(--tx2)}
.agree-nm{font-size:14px;text-align:center;color:var(--sub2);margin-top:4px}
.agree-note{font-size:12.5px;line-height:1.7;color:var(--sub2);margin:0 0 14px}
.agree-btn{width:100%;height:50px;border:none;border-radius:999px;background:#E8C766;color:#1A1500;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer}
.agree-btn:disabled{opacity:.6}
@media (prefers-color-scheme: light){.agree-btn{background:#A87A0C;color:#FFF}}
.ok-top{margin:0 0 8px;padding:7px 12px;border-radius:8px;background:rgba(76,201,140,.12);border:1px solid rgba(76,201,140,.45);color:#8FE0B8;font-size:12px;font-weight:700;line-height:1.5}
@media (prefers-color-scheme: light){.ok-top{background:#E6F7EE;border-color:#9ED9BA;color:#137A4A}}
/* OK・NGの一覧（表の形） */
.rules{margin:16px 0 6px}
.rules.big{margin:12px 0 16px}
.rules-hd{font-size:14px;font-weight:900;color:var(--tx2);margin:0 2px 8px}
.rt{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--bk2)}
.rt-h,.rt-r{display:grid;grid-template-columns:40px minmax(0,1fr) 96px;align-items:center;gap:6px;padding:0 12px}
.rt-h{font-size:11px;color:var(--sub2);padding-top:7px;padding-bottom:7px;border-bottom:1px solid var(--ln)}
.rt-h span:last-child{text-align:center}
.rt-r{min-height:58px;border-bottom:1px solid var(--ln)}
.rt-r:last-child{border-bottom:none}
.rt-r .ic{font-size:22px;text-align:center}
.rt-r .tg{font-size:13.5px;font-weight:700;line-height:1.4;color:var(--tx2);padding:8px 0}
.rt-r .jd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rt-r .jd b{display:inline-block;min-width:56px;text-align:center;font-size:15px;font-weight:900;border-radius:999px;padding:4px 0;color:#fff;letter-spacing:.06em}
.rt-r .jd small{font-size:10.5px;font-weight:700}
.rt-r.ok .jd b{background:#1E9E63}.rt-r.ng .jd b{background:#D93636}
.rt-r.ng .jd small{color:#FF8A80}
.rt-r.ok{background:rgba(76,201,140,.07)}.rt-r.ng{background:rgba(255,82,82,.06)}
@media (prefers-color-scheme: light){.rt{background:#FFFFFF}.rt-r.ok{background:#F1FBF5}.rt-r.ng{background:#FFF5F5}.rt-r.ng .jd small{color:#C62828}}
.ban-top b,.ok-top b{font-weight:900}
/* ルール・注意の表示はすべて中央寄せ（2026-11-24） */
.rules-hd{text-align:center}
.rt-h span,.rt-r .tg{text-align:center}
.rt-r .ic{justify-self:center}
.ban-top,.ok-top{text-align:center}
.agree-note{text-align:center}
/* 更新中の表示 */
.boot{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#A6A6B0;font-size:14px;font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(232,199,102,.25);border-top-color:#E8C766;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
.spin.lg{width:36px;height:36px;border-width:3px;margin:0}
.spin.sm{width:11px;height:11px;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.busy{position:fixed;top:10px;left:50%;transform:translate(-50%,-80px);z-index:50;background:#2C2C34;color:#FFF;border:1px solid #E8C766;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .25s ease;white-space:nowrap}
.busy.on{transform:translate(-50%,0)}
.busy.ok{border-color:#4CC98C;color:#9FE8C3}
body.tv .upd button:disabled{opacity:.7;cursor:default}
/* ════ 明るいモード：スマホの設定（ライト／ダーク）に合わせて自動で切り替える（2026-11-24） ════ */
@media (prefers-color-scheme: light){
  html:has(body.tv){background:#F6F5F2}
  body.tv{--gd:#A87A0C;--sv:#6F7B8A;--bz:#A4602F;--bk:#F6F5F2;--bk2:#FFFFFF;--ln:#E4E2DC;--tx2:#1B1B20;--sub2:#6E6E78}
  body.tv .r,body.tv .vr{box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid #ECEAE5}
  body.tv .r.me{border-color:var(--gd);background:#FFF9E8}
  body.tv .tabs{background:#EAE8E3}
  body.tv .tabs button.on{background:#FFFFFF;color:var(--tx2);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .c.p{background:#EFE9FF;color:#5B34C4}.c.y{background:#FFF1E2;color:#B25300}.c.f{background:#E6F5FD;color:#0B6E9E}
  .vh .qh.p,.vr .q.p{color:#5B34C4}.vh .qh.y,.vr .q.y{color:#B25300}.vh .qh.f,.vr .q.f{color:#0B6E9E}
  .vr .q.z{color:#C9C8CF}
  .pt.supporter{background:#E4F2FD;color:#1468A8}.pt.partner{background:#E2F6EC;color:#127A49}.pt.producer{background:#EFE9FF;color:#5B34C4}
  .pt.guest{background:#EEEEF1;color:#6E6E78}.pt.you{background:#E8C766;color:#2B2000}
  body.tv .foot{color:#B5B3AD}
  body.tv .demo{background:#FFF4DA;border-color:#E9C877;color:#6B4E00}
  .secret{border-color:#E7CF8A;background:#FFF8E4;color:#4B4330}
  .secret b{color:#8A5D00}
  .boot{color:#6E6E78}
  .spin{border-color:rgba(168,122,12,.2);border-top-color:#A87A0C}
  .busy{background:#FFFFFF;color:#1B1B20;border-color:#A87A0C;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .busy.ok{border-color:#1E9E63;color:#137A4A}
  body.tv .upd button{background:#FFFFFF;border-color:#E4E2DC;color:#1B1B20}
}
/* 管理（リンク発行） */
.adm{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.adm h1{font-size:20px;color:var(--ac);margin:0 0 6px}
.adm p.lead{font-size:12.5px;color:var(--sub);line-height:1.7;margin:0 0 16px}
.adm input[type=password]{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:8px 14px;cursor:pointer;border:1.5px solid var(--ac);background:var(--ac);color:#fff;white-space:nowrap}
.btn.out{background:#fff;color:var(--ac)}
.btn.gray{background:#fff;color:var(--sub);border-color:var(--bd)}
.btn:disabled{opacity:.4;cursor:default}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.mrow .mn{flex:1;min-width:120px;font-weight:700}
.mrow .st{font-size:11.5px;color:var(--sub)}
.mrow .st.on{color:#13824F;font-weight:700}
.msg{font-size:12.5px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw5EGadYPogNQ5_8KMtedFfz3QLoPBYZj7sa-tCpvgIXh2ZaaYXkHZs755VFS0FcbR1Gw/exec';
const GAS_KEY='iito2026secret';
const Q=new URLSearchParams(location.search);
const DEMO=Q.get('demo')==='1';
const PLAN_LABEL={supporter:'サポーター',partner:'パートナー',producer:'プロデューサー'};
const PLAN_ORDER=['supporter','partner','producer'];
const app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString();
const pad=n=>String(n).padStart(2,'0');

async function gas(action,payload={}){
  if(DEMO)return demo(action,payload);
  try{
    const body=JSON.stringify({key:GAS_KEY,action,...payload});
    const res=await fetch(GAS_URL+'?d='+encodeURIComponent(body),{method:'GET'});
    return await res.json();
  }catch(e){return null;}
}

// ════════ 演者の画面 ════════
let view={tab:'ranking',evId:'',data:null,timer:null};
try{view.tab=sessionStorage.getItem('talent_tab')||'ranking';}catch(e){}
// 更新中の表示（2026-11-24）：はじめは画面の真ん中に「読み込み中」、表示した後の更新は上に「更新中」の帯を出す
let loadingNow=false;
function setBusy(on,done){
  let el=document.getElementById('busy');
  if(!el){el=document.createElement('div');el.id='busy';document.body.appendChild(el);}
  if(on){el.className='busy on';el.innerHTML='<span class="spin"></span>更新中...';}
  else if(done){el.className='busy on ok';el.innerHTML='✓ 最新になりました';clearTimeout(el._t);el._t=setTimeout(()=>{el.className='busy';},1500);}
  else el.className='busy';
  const b=document.getElementById('upd-btn');if(b){b.disabled=!!on;b.innerHTML=on?'<span class="spin sm"></span>更新中':'いま更新';}
}
async function loadTalent(){
  const k=Q.get('k')||'';
  if(!k&&!DEMO){showErr('リンクが正しくありません','運営から届いた専用リンクを、もう一度開いてください。');return;}
  if(loadingNow)return;loadingNow=true;
  if(!view.data){document.body.classList.add('tv');app.innerHTML='<div class="boot"><span class="spin lg"></span><div>読み込み中...</div></div>';}
  else setBusy(true);
  let r=null;
  try{r=await gas('talentView',{k,evId:view.evId});}finally{loadingNow=false;}
  if(DEMO)await new Promise(x=>setTimeout(x,400));
  if(!r){setBusy(false);if(!view.data)showErr('読み込めませんでした','通信環境を確認して、ページを開き直してください。');return;}
  const had=!!view.data;
  if(!r.ok){showErr('このリンクは使えません','リンクの有効期限が切れたか、停止されています。運営にお問い合わせください。');stopTimer();return;}
  view.data=r;if(r.event)view.evId=r.event.id;
  renderTalent();
  if(had)setBusy(false,true);
}
function showErr(t,m){document.body.classList.add('tv');app.innerHTML=`<div class="err"><h2>${esc(t)}</h2><p>${esc(m)}</p></div>`;}
function stopTimer(){if(view.timer)clearInterval(view.timer);view.timer=null;}
function tagsFor(v){
  const t=[];
  if(v.guest)t.push('<span class="tag t-guest">会員以外</span>');
  PLAN_ORDER.forEach(p=>{if((v.plans||[]).includes(p))t.push(`<span class="tag t-${p}">${PLAN_LABEL[p]}</span>`);});
  if(v.free>0)t.push('<span class="tag t-free">無料</span>');
  if(v.paid>0)t.push('<span class="tag t-paid">有料</span>');
  return t.join('');
}
function brText(v){
  const p=[];if(v.plan)p.push('プラン'+num(v.plan));if(v.free)p.push('無料'+num(v.free));if(v.paid)p.push('有料'+num(v.paid));return p.join('・');
}
function cdText(end){
  const ms=end-Date.now();if(!end||ms<=0)return '投票は終了しました';
  const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000)%24,m=Math.floor(ms/60000)%60,sec=Math.floor(ms/1000)%60;
  return `終了まで <b>${d?d+'日 ':''}${pad(h)}:${pad(m)}:${pad(sec)}</b>`;
}
let cdTimer=null;
// ── 初めて開いたときの注意事項（承認するまで中身を見せない。2026-11-24）──
//  承認したことはこの端末に覚え、サーバーの「演者承認記録」にも残す。リンクを作り直すと、もう一度出る
// OK・NGをひと目で分かるように並べる（2026-11-24）
function rulesHtml(big){
  // 対象（下のメニューと同じアイコン）と、送信・SNS掲載の可否を表で並べる
  return `<div class="rules${big?' big':''}">
    <div class="rules-hd">🔒 ご本人様専用ページのルール</div>
    <div class="rt">
      <div class="rt-h"><span></span><span>対象</span><span>送信・SNS掲載</span></div>
      <div class="rt-r ok"><span class="ic">🏆</span><span class="tg">「ランキング」画面の<br>スクリーンショット</span><span class="jd"><b>OK</b></span></div>
      <div class="rt-r ng"><span class="ic">🙌</span><span class="tg">「投票者一覧」画面の<br>スクリーンショット</span><span class="jd"><b>NG</b><small>違反は失格</small></span></div>
      <div class="rt-r ng"><span class="ic">🔗</span><span class="tg">本ページのURL</span><span class="jd"><b>NG</b></span></div>
    </div>
  </div>`;
}
function agreedKey(){return 'talent_ok_'+(Q.get('k')||'demo');}
function hasAgreed(){try{return localStorage.getItem(agreedKey())==='1';}catch(e){return false;}}
function renderAgree(){
  document.body.classList.add('tv');
  const name=view.data&&view.data.model?esc(view.data.model.name)+' 様':'';
  app.innerHTML=(DEMO?demoBar():'')+`<div class="agree-wrap"><div class="agree-box">
    <div class="agree-ttl">ご利用の前に</div>${name?`<div class="agree-nm">${name}</div>`:''}
    ${rulesHtml(true)}
    <p class="agree-note">上記の内容を確認のうえ、「承認する」を押してください。承認いただいた場合に限り、本ページをご覧いただけます。</p>
    <button type="button" class="agree-btn" id="agree-btn" onclick="doAgree()">承認する</button>
  </div></div>`;
}
async function doAgree(){
  const b=document.getElementById('agree-btn');if(b){b.disabled=true;b.textContent='送信中...';}
  try{if(!DEMO)await gas('talentAgree',{k:Q.get('k')||'',ua:navigator.userAgent});}catch(e){}
  try{localStorage.setItem(agreedKey(),'1');}catch(e){}
  renderTalent();window.scrollTo(0,0);
}
function renderTalent(){
  if(!hasAgreed()){renderAgree();return;}

  document.body.classList.add('tv');
  const d=view.data;if(!d)return;
  const at=new Date(d.at);
  const stamp=`${at.getMonth()+1}/${at.getDate()} ${pad(at.getHours())}:${pad(at.getMinutes())}時点`;
  if(!d.event){app.innerHTML=(DEMO?demoBar():'')+`<div class="wrap"><div class="hd"><div class="nm">${esc(d.model.name)}</div></div><div class="empty">いま開催中の投票イベントはありません。</div><div class="foot">iito JAPAN</div></div>`;return;}
  const rs=d.ranking||[],vs=d.voters||[];
  const me=rs.find(x=>x.me);
  const T=d.totals||{plan:0,free:0,paid:0,total:0};
  // 1つ上の順位を抜くのに必要な票数（1位なら、2位との差）
  let gap='';
  if(me){
    const above=rs.filter(x=>x.total>me.total).sort((a,b)=>a.total-b.total)[0];
    if(me.total===0)gap='まだ投票がありません';
    else if(above)gap=`${above.rank}位まで あと<b>${num(above.total-me.total+1)}</b>票`;
    else{const next=rs.filter(x=>!x.me&&x.total<me.total).sort((a,b)=>b.total-a.total)[0];gap=next?`2位と<b>${num(me.total-next.total)}</b>票差でトップ`:'トップです';}
  }
  // 見せるのは「いまの順位」と「ランキング」「誰が自分に投票したか（プラン・有料・無料の内訳）」（2026-11-24）。見られるのは開催中のイベントだけ
  const head=`<div class="hd"><div class="evn">${esc(d.event.name)}</div></div>
  ${view.tab==='ranking'?`<div class="hero">
    <div class="nm">${esc(d.model.name)}</div>
    ${me?`<div class="rk-lbl">いまの順位（${rs.length}人中）</div><div class="rk-big">${me.rank}<small>位</small></div>${gap?`<div class="gap">${gap}</div>`:''}`:''}
    <div class="tot">合計 <b>${num(T.total)}</b>票</div>
  </div>`:`<div class="hero2">
    ${me?`<div class="h2r"><div class="h2l">いまの順位<span>（${rs.length}人中）</span></div><div class="h2v">${me.rank}<small>位</small></div></div>`:''}
    <div class="h2m">
      <div class="h2nm">${esc(d.model.name)}</div>
      ${gap?`<div class="h2gap">${gap}</div>`:''}
      <div class="h2tot">合計 <b>${num(T.total)}</b>票</div>
    </div>
  </div>`}
`;
  // 下に浮かぶメニュー（投票ページの下のメニューと同じ形。スクロールしても常に表示）
  const tabbar=`<nav class="ttb" aria-label="メニュー"><button type="button" class="ttb-btn${view.tab==='ranking'?' on':''}" onclick="setTab('ranking')"><span class="ttb-ic">🏆</span><span class="ttb-lb">ランキング</span></button><button type="button" class="ttb-btn${view.tab==='voters'?' on':''}" onclick="setTab('voters')"><span class="ttb-ic">🙌</span><span class="ttb-lb">投票者一覧</span></button></nav>`;
  const k=r=>r<=3?' k'+r:'';
  let body='';
  if(view.tab==='voters'){
    // 1人1行：順位・名前・プラン・有料・無料・合計を横に並べる（見出しは上に1回だけ）
    const z=(v,c)=>`<span class="q ${c}${v?'':' z'}">${num(v)}</span>`;
    body=vs.length?`<div class="ban-top">🙌 この画面のスクショ：<b>送信・掲載 NG</b>（違反は失格）</div><div class="vt"><div class="vh"><span>順位</span><span>名前</span><span class="qh p">プラン</span><span class="qh y">有料</span><span class="qh f">無料</span><span class="qh">合計</span></div>${vs.map(v=>`<div class="vr${k(v.rank)}"><span class="n">${v.rank}</span><span class="nm">${esc(v.nick)}</span>${z(v.plan,'p')}${z(v.paid,'y')}${z(v.free,'f')}<span class="tv2">${num(v.total)}</span></div>`).join('')}</div>`
      :'<div class="empty">まだ投票がありません。</div>';
  }else{
    body=`<div class="ok-top">🏆 この画面のスクショ：<b>SNS掲載 OK</b></div><div class="list">${rs.map(x=>`<div class="r${k(x.rank)}${x.me?' me':''}"><span class="n">${x.rank}</span><span class="b"><span class="nm">${esc(x.name)}</span>${x.me?'<span class="pt you">あなた</span>':''}</span><span class="v">${num(x.total)}<small>票</small></span></div>`).join('')}</div>`;
  }
  app.innerHTML=(DEMO?demoBar():'')+`<div class="wrap">${head}${body}
    ${rulesHtml()}
    <div class="upd">${stamp}・1分ごとに自動更新 <button id="upd-btn" onclick="loadTalent()">いま更新</button></div>
    <div class="foot">iito JAPAN</div></div>${tabbar}`;
}

// ── 下のメニュー：下にスクロールで隠し、上にスクロールで出す（投票ページ index.html の onTbScroll と同じ動き。2026-11-24）──
//  ・一度隠したら、利用者が自分で上へスクロールして、上の順位の表示が画面に見えるところまで戻るまでは出さない
//    （iPhoneの端での跳ね返り・自動更新による位置のずれでは出さない）
let tbLastY=0,tbUpAcc=0,tbDownAcc=0,tbTouching=false,tbInputAt=0;
function tbMaxY(){return Math.max(0,document.documentElement.scrollHeight-window.innerHeight);}
function tbUpNeed(){return Math.max(45,Math.min(180,tbMaxY()*0.3));}
function tbByUser(){return tbTouching||Date.now()-tbInputAt<1500;}
['touchstart','touchmove'].forEach(ev=>window.addEventListener(ev,()=>{tbTouching=true;tbInputAt=Date.now();},{passive:true}));
['touchend','touchcancel'].forEach(ev=>window.addEventListener(ev,()=>{tbTouching=false;tbInputAt=Date.now();},{passive:true}));
window.addEventListener('wheel',()=>{tbInputAt=Date.now();},{passive:true});
window.addEventListener('keydown',()=>{tbInputAt=Date.now();});
function onTbScroll(){
  const y=Math.min(tbMaxY(),Math.max(0,window.scrollY||0)),dy=y-tbLastY;tbLastY=y;
  const hidden=document.body.classList.contains('tb-hide');
  if(dy>0){tbUpAcc=0;tbDownAcc+=dy;if(y>=40&&tbDownAcc>=8)document.body.classList.add('tb-hide');return;}
  if(dy<0){
    tbDownAcc=0;
    if(!hidden)return;
    if(!tbByUser()){tbUpAcc=0;return;}
    // 上の順位の表示（大きな順位／コンパクトな帯）が画面に見えるところまで戻ったら出す（2026-11-24）
    if(heroInView()||y<40)document.body.classList.remove('tb-hide');
  }
}
window.addEventListener('scroll',onTbScroll,{passive:true});
function heroInView(){const h=document.querySelector('.hero,.hero2');if(!h)return true;const r=h.getBoundingClientRect();return r.bottom>0&&r.top<window.innerHeight;}
function tbReset(){document.body.classList.remove('tb-hide');tbLastY=window.scrollY||0;tbUpAcc=tbDownAcc=0;}
function setTab(t){if(view.tab!==t){view.tab=t;try{sessionStorage.setItem('talent_tab',t);}catch(e){}renderTalent();window.scrollTo(0,0);tbReset();}}

// ════════ 管理者：専用リンクの発行・停止 ════════
let admTok='';try{admTok=sessionStorage.getItem('talent_adm')||'';}catch(e){}
function renderAdminLogin(msg){
  app.innerHTML=`<div class="adm"><h1>演者ページ：専用リンクの発行</h1>
    <p class="lead">管理画面と同じパスワードでログインしてください。</p>
    <input type="password" id="pw" placeholder="管理者パスワード" onkeydown="if(event.key==='Enter')admLogin()"/>
    <div style="margin-top:10px"><button class="btn" onclick="admLogin()">ログイン</button></div>
    <div class="msg" id="msg" style="color:#C0392B">${esc(msg||'')}</div></div>`;
}
async function admLogin(){
  const pw=document.getElementById('pw').value;if(!pw)return;
  const r=await gas('adminLogin',{pw});
  if(!r||!r.ok){renderAdminLogin(r&&r.error==='locked'?'しばらくログインできません。時間をおいてお試しください。':'パスワードが違います。');return;}
  admTok=r.token;try{sessionStorage.setItem('talent_adm',admTok);}catch(e){}
  loadAdmin();
}
async function loadAdmin(note){
  if(!admTok&&!DEMO){renderAdminLogin();return;}
  const r=await gas('listTalentKeys',{adminToken:admTok});
  if(!r||!r.ok){admTok='';try{sessionStorage.removeItem('talent_adm');}catch(e){}renderAdminLogin(r&&r.error==='admin_required'?'もう一度ログインしてください。':'読み込めませんでした。');return;}
  const base=location.origin+location.pathname;
  const ms=(r.models||[]).slice().sort((a,b)=>(a.hidden-b.hidden));admModels=ms;admBase=base;
  app.innerHTML=(DEMO?demoBar():'')+`<div class="adm"><h1>演者ページ：専用リンクの発行</h1>
    <p class="lead">モデルごとに専用リンクを発行し、本人にだけ送ってください。リンクを知っている人は誰でもそのページを見られます。<br>
    「作り直す」を押すと古いリンクは使えなくなります。「停止」でそのモデルのページを見られなくします。</p>
    <div class="msg" id="msg">${esc(note||'')}</div>
    ${ms.map((m,i)=>`<div class="mrow"><span class="mn">${esc(m.name)}${m.hidden?' <span class="st">（非表示）</span>':''}</span>
      <span class="st${m.active?' on':''}">${m.active?'発行済み':'未発行'}</span>
      ${m.active?`<button class="btn out" onclick="copyLink(${i})">リンクをコピー</button>
        <button class="btn gray" onclick="issue(${i},true)">作り直す</button>
        <button class="btn gray" onclick="revoke(${i})">停止</button>`
       :`<button class="btn" onclick="issue(${i},false)">発行する</button>`}
    </div>`).join('')}</div>`;
}
let admModels=[],admBase='';
async function issue(i,re){
  const m=admModels[i];if(!m)return;const id=m.id,name=m.name;
  if(re&&!confirm(`${name} のリンクを作り直しますか？\n今のリンクは使えなくなります。`))return;
  const r=await gas('issueTalentKey',{adminToken:admTok,modelId:id});
  loadAdmin(r&&r.ok?`${name} のリンクを発行しました。「リンクをコピー」で本人に送ってください。`:'発行できませんでした。');
}
async function revoke(i){
  const m=admModels[i];if(!m)return;const id=m.id,name=m.name;
  if(!confirm(`${name} のリンクを停止しますか？`))return;
  const r=await gas('revokeTalentKey',{adminToken:admTok,modelId:id});
  loadAdmin(r&&r.ok?`${name} のリンクを停止しました。`:'停止できませんでした。');
}
async function copyLink(i){
  const m=admModels[i];if(!m)return;const url=admBase+'?k='+m.key,name=m.name;
  try{await navigator.clipboard.writeText(url);document.getElementById('msg').textContent=`${name} のリンクをコピーしました。`;}
  catch(e){prompt('このリンクをコピーしてください',url);}
}

  return {ok:true};
}
